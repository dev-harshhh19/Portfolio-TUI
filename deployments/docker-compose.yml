version: '3.8'

services:
  portfolio-tui-ssh:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: harshad-portfolio-ssh
    restart: always
    ports:
      # Map standard external SSH (22) or custom (2222) to container port 2222
      - "22:2222"
    environment:
      - SSH_HOST=0.0.0.0
      - SSH_PORT=2222
      - SSH_KEY_PATH=/app/.ssh/harshad_ed25519
    volumes:
      # Persist host ed25519 key across restarts to avoid client host key fingerprint warnings
      - ssh_keys:/app/.ssh

volumes:
  ssh_keys:
